name: Release

# A version tag, like 0.1.0, builds and tests the jar from that commit, with the game data its submodule
# points to, and drafts the release with it, the start scripts, and the version's part of the changelog.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag is the version being released
        run: |
          grep -qx "version = \"$GITHUB_REF_NAME\"" build.gradle.kts \
            || { echo "build.gradle.kts isn't at version $GITHUB_REF_NAME"; exit 1; }

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Take the release notes from the changelog
        run: |
          awk -v version="$GITHUB_REF_NAME" '/^## / { found = ($2 == version); next } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/libs/kore-$GITHUB_REF_NAME.jar" scripts/start.bat scripts/start.sh \
            --draft --prerelease --title "Kore $GITHUB_REF_NAME" --notes-file notes.md
